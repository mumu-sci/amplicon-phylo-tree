name: verify

# Every push and pull request re-runs the checks that this project's own review
# found necessary.  The point is not "tests pass" as decoration: it is that
# documentation and scripts cannot drift apart again (R2's B4/M3 were exactly
# "the doc promised a flag the script never accepted").
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Skill self-test (coordinate contract, stops, genetic codes)
        working-directory: skills/amplicon-phylo-tree
        run: python scripts/selftest.py

      - name: Documentation vs scripts consistency
        working-directory: skills/amplicon-phylo-tree
        run: python scripts/check_consistency.py

      - name: Regression tests (black-box, one per defect found by review)
        working-directory: skills/amplicon-phylo-tree
        run: python scripts/regression_tests.py

      - name: The bundled example really is reproducible
        working-directory: skills/amplicon-phylo-tree
        # README and the smoke test both promise these two files are byte-identical
        # to what the generator produces. If that ever stops being true, the
        # documented baseline numbers are not reproducible either.
        run: |
          rm -rf /tmp/regen && mkdir -p /tmp/regen
          cp assets/example-mini/_make_example.py /tmp/regen/
          (cd /tmp/regen && python _make_example.py)
          cmp /tmp/regen/asv_table.tsv assets/example-mini/asv_table.tsv
          cmp /tmp/regen/rep_set.fasta assets/example-mini/rep_set.fasta
          echo "example-mini regenerates byte-identically"

      - name: End-to-end smoke test (needs MAFFT and FastTree)
        working-directory: skills/amplicon-phylo-tree
        # The logic lives in scripts/smoke_test.sh so it can be edited with an
        # ordinary commit: a workflow file needs the `workflow` token scope, a
        # script does not.  Exit 2 from the script means the tools were missing,
        # which is a LOUD skip (a warning annotation), not a silent pass.
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq mafft fasttree || true
          set +e
          bash scripts/smoke_test.sh
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::warning::MAFFT/FastTree unavailable - the smoke test did NOT run"
            exit 0
          fi
          exit "$rc"
